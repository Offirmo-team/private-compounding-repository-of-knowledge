<!doctype html>
<meta charset="utf-8" />

<script type="module">
	import startꓽstorypad from "@monorepo-private/storypad"
	import decoratorⵧdiagnostics from "@monorepo-private/storypad/decorators/diagnostics"
	import nearest_pkg from "../../../package.json"

	const DEBUG = false

	// important to load async so that the stories don't pollute the global scope too early (ex. before SXC)
	const stories = import.meta.glob("../../src/**/*.stories.(js|jsx|ts|tsx|mdx)")
	const storiesⵧshared = {} //import.meta.glob('@monorepo-private/storypad/module/src/__shared/stories/html/*.stories.(js|jsx|ts|tsx|mdx)')
	const storiesⵧreset = {} //import.meta.glob('../../../../css--0-reset/module/**/*.stories.(js|jsx|ts|tsx|mdx)')
	const storiesⵧfoundation = {} //import.meta.glob('@monorepo-private/css--foundation/module/src/**/*.stories.(js|jsx|ts|tsx|mdx)')
	const storiesⵧerrors = {} //import.meta.glob('@monorepo-private/css--utils--diagnostics/module/src/**/*.stories.(js|jsx|ts|tsx|mdx)')
	if (DEBUG)
		console.log("BOOTSTRAP stories", {
			stories,
			storiesⵧshared,
			storiesⵧreset,
			storiesⵧfoundation,
			storiesⵧerrors,
		})

	startꓽstorypad(
		{
			".sharedⳇhtml": storiesⵧshared,
			"0-reset": storiesⵧreset,
			"1-foundation": storiesⵧfoundation,
			"2-framework": stories,
			"@monorepo-privateⳇcss--utils--diagnostics": storiesⵧerrors,
		},
		{
			root_title: nearest_pkg?.name,
			decorators: [
				(story) => {
					//import('@monorepo-private/css--reset')
					//import('@monorepo-private/css--foundation')
					import("@monorepo-private/css--framework")
					//import('../../src/themes/theme--dark--colorhunt212.css')
					return story
				},
				decoratorⵧdiagnostics,
			],
		},
	)
</script>
